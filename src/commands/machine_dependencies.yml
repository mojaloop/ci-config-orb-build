description: >
  Install general dependencies
steps:
  - run:
      name: Install general dependencies
      command: |
        ## Add Package Repos
        ## Ref: https://docs.confluent.io/platform/current/installation/installing_cp/deb-ubuntu.html#get-the-software
        sudo install -d -m 0755 /etc/apt/keyrings
        sudo wget -qO /etc/apt/keyrings/confluent-clients.asc https://packages.confluent.io/clients/deb/archive.key
        printf 'Types: deb\nURIs: https://packages.confluent.io/clients/deb\nSuites: %s\nComponents: main\nSigned-By: /etc/apt/keyrings/confluent-clients.asc\n' "$(lsb_release -cs)" \
          | sudo tee /etc/apt/sources.list.d/confluent-clients.sources
        sudo apt-get update

        ## Install deps
        sudo apt-get install -y librdkafka-dev curl bash musl-dev libsasl2-dev
        sudo ln -s /usr/lib/x86_64-linux-musl/libc.so /lib/libc.musl-x86_64.so.1
