description: >
  Generate a CycloneDX 1.6 SBOM with Syft for a given target and write it to
  disk. The target is substituted into the shell command, so image references
  that contain env vars (e.g. "$DOCKER_ORG/$CIRCLE_PROJECT_REPONAME:local") are
  expanded at runtime. Works on both the Alpine docker executor (root, /bin/sh)
  and the Ubuntu machine executor (sudo). Reused by the license gate and,
  optionally, by grype_scan.
parameters:
  target:
    type: string
    default: "dir:."
    description: >
      Syft scan target. Use "dir:." for a source tree, or an image reference
      such as "$DOCKER_ORG/$CIRCLE_PROJECT_REPONAME:local" for a loaded image.
  output:
    type: string
    default: "/tmp/sbom.cdx.json"
    description: Path to write the CycloneDX JSON SBOM.
  syft_version:
    type: string
    default: "v1.45.0"
    description: Pinned Syft release installed when syft is not already present.
steps:
  - run:
      name: Install Syft (pinned) if missing
      command: |
        set -e
        if command -v syft >/dev/null 2>&1; then syft version; exit 0; fi
        if command -v apk >/dev/null 2>&1; then apk add --no-cache curl tar >/dev/null; fi
        BINDIR=/usr/local/bin
        if [ -w "$BINDIR" ]; then SUDO=; else SUDO=sudo; fi
        curl -sSfL "https://raw.githubusercontent.com/anchore/syft/<< parameters.syft_version >>/install.sh" \
          | $SUDO sh -s -- -b "$BINDIR" "<< parameters.syft_version >>"
        syft version
  - run:
      name: Generate CycloneDX SBOM for << parameters.target >>
      command: |
        set -e
        syft "<< parameters.target >>" -o cyclonedx-json="<< parameters.output >>"
        echo "Wrote CycloneDX SBOM to << parameters.output >>"
